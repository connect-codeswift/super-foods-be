version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    target-branch: dev
    open-pull-requests-limit: 5
    groups:
      # One PR per ecosystem keeps the review load sane; security fixes
      # still arrive on their own.
      dev-dependencies:
        dependency-type: development
      production-dependencies:
        dependency-type: production

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    target-branch: dev

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    target-branch: dev
